services:
  - type: web
    name: domain-buy-checker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: CF_API_TOKEN
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
